name: Update content manifest

on:
  push:
    branches: [main]
    paths:
      - "content/novels/**"
      - "content/chapters/**"
      - "scripts/build-manifest.py"
      - ".github/workflows/update-content-manifest.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yumao-publication
  cancel-in-progress: false

jobs:
  update-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build manifest
        run: python scripts/build-manifest.py

      - name: Commit manifest if changed
        id: publish
        run: |
          if [ -z "$(git status --porcelain -- content/manifest.json feed.xml)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/manifest.json feed.xml
          git commit -m "Update content manifest"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Upload public site artifact
        if: steps.publish.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: update-manifest
    if: needs.update-manifest.outputs.changed == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Publish due chapters to GitHub Pages
        uses: actions/deploy-pages@v4
