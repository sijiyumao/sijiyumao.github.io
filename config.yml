backend:
  name: turbo-github
  turbo_site_id: 9cad78ab-3e71-4493-b3d5-2d81f11e8d1b
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "library"
    label: "Novel Library"
    description: "Manage novels and chapters for Yumao Novels."
    files:
      - label: "All Novels"
        name: "novels"
        file: "content/novels.json"
        format: "json"
        fields:
          - label: "Novels"
            name: "novels"
            widget: "list"
            label_singular: "Novel"
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - {label: "Novel ID", name: "id", widget: "string", hint: "Use lowercase letters and hyphens, e.g. my-first-novel"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - {label: "Chinese Translation", value: "translation"}
                  - {label: "Original Novel", value: "original"}
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["ongoing", "completed", "hiatus"]
              - {label: "Description", name: "desc", widget: "text"}
              - label: "Cover Image"
                name: "cover"
                widget: "image"
                required: false
                hint: "Optional. The current reader design also works without a cover."
              - label: "Tags"
                name: "tags"
                widget: "list"
                field: {label: "Tag", name: "tag", widget: "string"}
              - label: "Chapters"
                name: "chapters"
                widget: "list"
                label_singular: "Chapter"
                summary: "Chapter {{fields.n}} — {{fields.title}}"
                collapsed: true
                fields:
                  - {label: "Chapter Number", name: "n", widget: "number", value_type: "int", min: 1}
                  - {label: "Chapter Title", name: "title", widget: "string"}
                  - {label: "Publication Date", name: "date", widget: "date", format: "YYYY-MM-DD"}
                  - label: "Chapter Text"
                    name: "text"
                    widget: "list"
                    label_singular: "Paragraph"
                    field: {label: "Paragraph", name: "paragraph", widget: "text"}
