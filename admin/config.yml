backend:
  name: turbo-github
  turbo_site_id: 9cad78ab-3e71-4493-b3d5-2d81f11e8d1b
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "novels"
    label: "Novels"
    label_singular: "Novel"
    description: "Create and manage novels."
    folder: "content/novels"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{fields.id}"
    sortable_fields: ["title", "status", "type"]
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Novel ID"
        name: "id"
        widget: "string"
        hint: "Permanent URL ID. Use lowercase letters, numbers and hyphens only, e.g. moonlit-teahouse. Do not change this after publishing chapters."
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Use lowercase letters, numbers, and hyphens only."]
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - {label: "Chinese Translation", value: "translation"}
          - {label: "Original Novel", value: "original"}
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - {label: "Ongoing", value: "ongoing"}
          - {label: "Completed", value: "completed"}
          - {label: "Hiatus", value: "hiatus"}
      - label: "Description"
        name: "desc"
        widget: "text"
      - label: "Cover Image"
        name: "cover"
        widget: "image"
        required: false
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        field: {label: "Tag", name: "tag", widget: "string"}

  - name: "chapters"
    label: "Chapters"
    label_singular: "Chapter"
    description: "Write and publish individual chapters."
    folder: "content/chapters"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{novel}-{chapter_number}-{slug}"
    sortable_fields: ["date", "title", "chapter_number"]
    fields:
      - label: "Chapter Title"
        name: "title"
        widget: "string"
      - label: "Novel"
        name: "novel"
        widget: "relation"
        collection: "novels"
        search_fields: ["title", "id"]
        display_fields: ["title"]
        value_field: "id"
        hint: "Choose the novel this chapter belongs to."
      - label: "Chapter Number"
        name: "chapter_number"
        widget: "number"
        value_type: "int"
        min: 1
      - label: "Publication Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
        hint: "Turn this on to keep the chapter hidden from the public site."
      - label: "Chapter Text"
        name: "body"
        widget: "richtext"
        modes: ["rich_text", "raw"]
        buttons: ["bold", "italic", "strikethrough", "link", "heading-two", "heading-three", "quote"]
        editor_components: []
