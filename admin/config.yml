backend:
  name: turbo-github
  turbo_site_id: 9cad78ab-3e71-4493-b3d5-2d81f11e8d1b
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "novels"
    label: "Novels"
    label_singular: "Novel"
    description: "Create and manage novel information, translation details, covers and tags."
    folder: "content/novels"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{id}}"
    sortable_fields: ["title", "status", "type"]
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Novel ID (internal — don’t change later)"
        name: "id"
        widget: "string"
        hint: "Permanent URL ID. Use lowercase letters, numbers and hyphens only, e.g. moonlit-teahouse. Do not change this after publishing chapters."
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Use lowercase letters, numbers, and hyphens only."]
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - {label: "Chinese Translation", value: "translation"}
          - {label: "Original Novel", value: "original"}
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - {label: "Ongoing", value: "ongoing"}
          - {label: "Completed", value: "completed"}
          - {label: "Hiatus", value: "hiatus"}
      - label: "Description"
        name: "desc"
        widget: "text"
      - label: "Original Chinese Title"
        name: "original_title"
        widget: "string"
        required: false
        hint: "For translations. Leave blank for original Yumao novels."
      - label: "Original Author"
        name: "original_author"
        widget: "string"
        required: false
      - label: "Translator"
        name: "translator"
        widget: "string"
        required: false
      - label: "Original Publication / Source"
        name: "source"
        widget: "string"
        required: false
        hint: "For example, the original publishing platform or source name."
      - label: "Total Chapters"
        name: "total_chapters"
        widget: "number"
        value_type: "int"
        min: 1
        required: false
        hint: "Optional. Use the original novel's total chapter count if known."
      - label: "Translator's Note"
        name: "translator_note"
        widget: "text"
        required: false
        hint: "Optional note shown on the novel page, not inside individual chapters."
      - label: "Cover Image"
        name: "cover"
        widget: "image"
        required: false
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        field: {label: "Tag", name: "tag", widget: "string"}

  - name: "chapters"
    label: "All Chapters"
    label_singular: "Chapter"
    description: "Write chapters, add translator notes, and control publication."
    folder: "content/chapters"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "Chapter {{chapter_number}} — {{title}}"
    slug: "{{novel}}-{{chapter_number}}-{{slug}}"
    sortable_fields: ["date", "title", "chapter_number"]
    view_filters:
      - label: "I'm Here, Don't Chicken Out"
        field: "novel"
        pattern: "ihdc"
      - label: "Published"
        field: "draft"
        pattern: false
      - label: "Drafts"
        field: "draft"
        pattern: true
    view_groups:
      - label: "Novel ID"
        field: "novel"
    fields:
      - label: "Chapter Title"
        name: "title"
        widget: "string"
      - label: "Novel"
        name: "novel"
        widget: "relation"
        collection: "novels"
        search_fields: ["title", "id"]
        display_fields: ["title"]
        value_field: "id"
        hint: "Choose the novel this chapter belongs to."
      - label: "Chapter Number"
        name: "chapter_number"
        widget: "number"
        value_type: "int"
        min: 1
      - label: "Publication Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
        hint: "Turn this on to keep the chapter hidden from the public site."
      - label: "Translator's Notes"
        name: "translator_notes"
        widget: "list"
        required: false
        summary: "Note {{fields.number}} — {{fields.note}}"
        hint: "Optional. Add notes here, then place [^1], [^2], etc. in the Chapter Text where each note should appear. You no longer need to type the note definitions at the bottom."
        fields:
          - {label: "Number", name: "number", widget: "number", value_type: "int", min: 1}
          - {label: "Note", name: "note", widget: "text"}
      - label: "Chapter Text"
        name: "body"
        widget: "richtext"
        modes: ["rich_text", "raw"]
        buttons: ["bold", "italic", "strikethrough", "link", "heading-two", "heading-three", "quote"]
        editor_components: []
        hint: "For translator notes, type [^1], [^2], etc. at the relevant words. Add the corresponding note text in the Translator’s Notes section above."

  - name: "ihdc_chapters"
    label: "IHDC Chapters"
    label_singular: "Chapter"
    description: "IHDC chapters only. Write chapters, add translator notes, and control publication."
    folder: "content/chapters"
